name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CamWeb-full/CamWeb-full

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          mkdir -p "$PWD/build-out"
          xcodebuild \
            -project CamWeb.xcodeproj \
            -scheme CamWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/derived" \
            -resolvePackageDependencies \
            CONFIGURATION_BUILD_DIR="$PWD/build-out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          echo "=== build-out ==="
          ls -la build-out || true
          echo "=== find app ==="
          find . derived build-out "$HOME/Library/Developer/Xcode/DerivedData" -name '*.app' -type d 2>/dev/null | head -50
          APP=""
          if [ -d build-out/CamWeb.app ]; then APP="build-out/CamWeb.app"; fi
          if [ -z "$APP" ]; then APP="$(find build-out -name '*.app' -type d | head -n 1)"; fi
          if [ -z "$APP" ]; then APP="$(find derived -name '*.app' -type d | head -n 1)"; fi
          test -n "$APP" && test -d "$APP" || { echo "still no app"; exit 1; }
          echo "Using $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" "Payload/"
          zip -qry CamWeb-unsigned.ipa Payload
          ls -lh CamWeb-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWeb-unsigned-ipa
          path: CamWeb-full/CamWeb-full/CamWeb-unsigned.ipa
          retention-days: 30
