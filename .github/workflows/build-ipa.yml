name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CamWeb-full/CamWeb-full

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -project CamWeb.xcodeproj -scheme CamWeb -resolvePackageDependencies

      - name: Build (unsigned)
        run: |
          mkdir -p "$PWD/build-out"
          xcodebuild \
            -project CamWeb.xcodeproj \
            -scheme CamWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/derived" \
            CONFIGURATION_BUILD_DIR="$PWD/build-out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          ls -la build-out || true
          APP=""
          [ -d build-out/CamWeb.app ] && APP="build-out/CamWeb.app"
          [ -z "$APP" ] && APP="$(find build-out derived -name '*.app' -type d | head -n 1)"
          test -n "$APP" || { echo "still no app"; find . -name '*.app' | head; exit 1; }
          echo "Using $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CamWeb-unsigned.ipa Payload
          ls -lh CamWeb-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWeb-unsigned-ipa
          path: CamWeb-full/CamWeb-full/CamWeb-unsigned.ipa
          retention-days: 30
