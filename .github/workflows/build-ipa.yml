name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Checkout alist-ios
        uses: actions/checkout@v4
        with:
          repository: gendago/alist-ios
          path: alist
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: alist/go.mod
          cache-dependency-path: alist/go.sum

      - name: Fetch Alist web UI
        working-directory: alist
        run: |
          curl -L https://github.com/alist-org/alist-web/releases/latest/download/dist.tar.gz -o dist.tar.gz
          tar -zxvf dist.tar.gz
          rm -rf public/dist
          mv -f dist public
          rm -rf dist.tar.gz

      - name: Build Alistlib.xcframework
        working-directory: alist
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p "$GITHUB_WORKSPACE/CamWeb-full/CamWeb-full/Frameworks"
          gomobile bind -target ios -bundleid com.personal.camweb \
            -o "$GITHUB_WORKSPACE/CamWeb-full/CamWeb-full/Frameworks/Alistlib.xcframework" \
            -ldflags "-s -w -X 'github.com/alist-org/alist/v3/internal/conf.Version=embedded'" \
            github.com/alist-org/alist/v3/alistlib
          ls -lh "$GITHUB_WORKSPACE/CamWeb-full/CamWeb-full/Frameworks/Alistlib.xcframework"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: CamWeb-full/CamWeb-full
        run: xcodegen generate

      - name: Resolve packages
        working-directory: CamWeb-full/CamWeb-full
        run: xcodebuild -project CamWeb.xcodeproj -scheme CamWeb -resolvePackageDependencies

      - name: Build (unsigned)
        working-directory: CamWeb-full/CamWeb-full
        run: |
          mkdir -p "$PWD/build-out"
          xcodebuild \
            -project CamWeb.xcodeproj \
            -scheme CamWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/derived" \
            CONFIGURATION_BUILD_DIR="$PWD/build-out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        working-directory: CamWeb-full/CamWeb-full
        run: |
          ls -la build-out || true
          APP=""
          [ -d build-out/CamWeb.app ] && APP="build-out/CamWeb.app"
          [ -z "$APP" ] && APP="$(find build-out derived -name '*.app' -type d | head -n 1)"
          test -n "$APP" || { echo "still no app"; find . -name '*.app' | head; exit 1; }
          echo "Using $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CamWeb-unsigned.ipa Payload
          ls -lh CamWeb-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWeb-unsigned-ipa
          path: CamWeb-full/CamWeb-full/CamWeb-unsigned.ipa
          retention-days: 30
