name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CamWeb-full/CamWeb-full

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CamWeb.xcodeproj \
            -scheme CamWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resolvePackageDependencies \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CamWeb.app"
          test -d "$APP" || { echo "Build product not found"; ls -R build/Build/Products; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CamWeb-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWeb-unsigned-ipa
          path: CamWeb-full/CamWeb-full/CamWeb-unsigned.ipa
          retention-days: 30
